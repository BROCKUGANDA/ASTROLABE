# Cut a GitHub Release and record the production deployment on every v* tag.
#
# docker-publish.yml ships the image; this workflow stamps the release that
# points at it and marks the production environment deployed with the live URL,
# so the GitHub Deployment history says what the VPS is actually running.
# Cutting a version is therefore: tag, push the tag — nothing else.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  deployments: write

jobs:
  release:
    name: release · deployment status
    # Same reason as ci.yml: this account gets no GitHub-hosted runner minutes.
    runs-on: [self-hosted, astrolabe]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title "ASTROLABE ${tag#v}" \
            --generate-notes \
            --verify-tag

      - name: Mark the production environment deployed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          sha="$(git rev-parse HEAD)"
          # --input, not -f: `auto_merge` must be a JSON boolean and
          # `required_contexts` an array. Sent as form fields they arrive as the
          # strings "false" and "[]", and the API answers 422 — measured when
          # recording the v1.0.1 deployment by hand.
          deployment="$(printf '{"ref":"%s","environment":"production","auto_merge":false,"required_contexts":[],"task":"deploy","production_environment":true}' "$sha" \
            | gh api -X POST repos/${{ github.repository }}/deployments --input - --jq .id)"
          gh api -X POST "repos/${{ github.repository }}/deployments/$deployment/statuses" \
            --input - <<STATUS
          {"state":"success","environment":"production","environment_url":"https://astrolabe.svalley.tech","log_url":"https://github.com/${{ github.repository }}/actions","description":"Container image ${tag} published to ghcr.io and served behind the shared Caddy edge."}
          STATUS

# ASTROLABE CI — the gates that must be green before anything merges.
#
# Order: cheap static checks, then the test suite (which carries the golden
# snapshot gate and the backtest metric gates), then the production build, then a
# secret scan over the emitted bundle, then a smoke test that drives the BUILT
# server the way a judge would.
#
# The smoke test is deliberately behavioural and not just "healthz returned 200".
# Three real defects shipped past a green pipeline before this existed: the build
# script's `cp -r` failing on Windows, `/api/readyz` reporting db down because
# DATABASE_URL was an absolute sandbox path, and sign-in returning 500 under
# NODE_ENV=production because the session layer refuses to invent a secret. All
# three are now asserted here, on the artifact, not on the dev server.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Throwaway value, committed openly on purpose: it signs a session in CI and is
  # useless outside it. A real deployment injects its own secret.
  SESSION_SECRET: ci-only-throwaway-session-secret-not-for-production
  DATABASE_URL: file:../db/custom.db

jobs:
  verify:
    name: typecheck · lint · tests · backtest · build · scan · smoke
    # This account gets no GitHub-hosted runner minutes: every `ubuntu-latest`
    # job — including an eight-line echo-only control and Dependabot's own —
    # ends in startup_failure with zero steps executed. So CI runs on the same
    # self-hosted runner the other projects on this VPS use. Change this one
    # line back to `ubuntu-latest` wherever hosted minutes exist.
    runs-on: [self-hosted, astrolabe]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        # bun.lock is the lockfile; frozen install keeps CI and local identical.
        run: bun install --frozen-lockfile

      - name: Generate the Prisma client
        # bun does not run a dependency's postinstall unless trusted, so the client
        # is not created by `bun install`. Both tsc (PrismaClient types) and
        # `next build` need it. Reads schema.prisma only — touches no database.
        run: bun run db:generate

      - name: Push the schema to the SQLite file
        # The readiness probe counts a real table, so the built server needs the
        # schema present in the tracked SQLite file. Writes stay inside the job.
        run: bun run db:push

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        # Formatting is enforced, not requested: `bun run format` fixes it locally.
        run: bun run format:check

      - name: Test suite (signals, properties, contracts, privacy, snapshot gate)
        run: bun test tests/

      - name: Golden snapshot gate is armed
        # The snapshot test re-records instead of failing when UPDATE_SNAPSHOTS=1.
        # That escape hatch must never be reachable in CI, and the baseline must be
        # committed — otherwise the gate passes on an empty comparison and stops
        # being a gate.
        run: |
          set -euo pipefail
          if [ -n "${UPDATE_SNAPSHOTS:-}" ]; then
            echo "UPDATE_SNAPSHOTS is set in CI; the snapshot gate would re-record rather than fail."
            exit 1
          fi
          git ls-files --error-unmatch tests/engine/__snapshots__/assessments.golden.json >/dev/null
          echo "Golden snapshot baseline is committed and the gate is armed."

      - name: Backtest scorecard (metric gates block the merge)
        # Routing, recall, precision, citation presence, hallucinated claims,
        # abstain correctness, false escalations, injection alteration, replay
        # determinism, as-of isolation, hot-path latency, slice fairness.
        run: bun run backtest

      - name: Dependency audit (blocks on unaccepted high/critical)
        # Fails on a new high in the production tree unless audit-allowlist.json carries a
        # reviewed reason for it (PRD 457). Dev-only chains are reported, not blocking.
        run: bun run audit

      - name: Build
        # `next build` must not run against a .next a dev server is using; CI has no
        # dev server, so this is safe here in a way it is not locally.
        run: bun run build

      - name: Scan the client bundle for secrets
        # The provider keys and session secret must never reach the browser. This
        # checks the EMITTED artifact, so it catches a leak introduced by any route.
        # Same script a contributor can run locally; CI is not the only place it works.
        run: bash scripts/ci-bundle-scan.sh

      - name: Smoke test the built server
        # Boots the production artifact and asserts behaviour: readiness, the
        # rendered shell, 401 without a session, a working sign-in, an authorised
        # journey read, and three refused cross-role calls. Kept in a repo script so
        # `bash scripts/ci-smoke.sh` runs the identical checks locally.
        run: bash scripts/ci-smoke.sh

      - name: Show the backtest scorecard in the run summary
        # So the numbers behind the gates travel with the run instead of living only
        # in a log line. This is a job summary, not an artifact: the account is at
        # its Actions artifact-storage quota, so an upload here fails the run even
        # when every gate above it passed.
        if: always()
        run: |
          if [ -f tool-results/backtest-scorecard.md ]; then
            cat tool-results/backtest-scorecard.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::no scorecard file was written"
            echo "No backtest scorecard was written." >> "$GITHUB_STEP_SUMMARY"
          fi

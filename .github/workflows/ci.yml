# ASTROLABE CI — the gates that must be green before anything merges.
#
# Order matters: typecheck and lint first (cheap, no build), then the test suite
# — which includes the golden snapshot gate — and only then the production build
# and a smoke test against the built server. No step is allow-failure, no matrix:
# one job, one verdict.
#
# The engine tests are pure and never touch the database, so CI needs no SQLite
# file and no migrations. The one place a database variable is required is the
# built server booting under NODE_ENV=production, where validateConfig() treats
# a missing DATABASE_URL as fatal — hence the dummy path below. /api/healthz
# deliberately performs no dependency checks, so the smoke step passes with a
# database that does not exist, which is exactly what a liveness probe is for.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: file:./ci-nonexistent.db

jobs:
  verify:
    name: typecheck · lint · tests · snapshot · build · smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        # bun.lock is the lockfile; frozen install keeps CI and local identical.
        run: bun install --frozen-lockfile

      - name: Generate the Prisma client
        # bun does not run a dependency's postinstall unless it is trusted, so the
        # client is not generated by `bun install`. Both `tsc` (the PrismaClient
        # types) and `next build` (src/lib/db.ts constructs it at import time)
        # need it. `prisma generate` reads schema.prisma only — no database.
        run: bun run db:generate

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test suite (signals, properties, golden snapshot gate)
        run: bun test tests/

      - name: Golden snapshot gate is armed
        # The snapshot test re-records instead of failing when UPDATE_SNAPSHOTS=1.
        # That escape hatch must never be reachable in CI, and the baseline must
        # actually be committed — otherwise the gate silently passes on an empty
        # comparison and stops being a gate.
        run: |
          set -euo pipefail
          if [ -n "${UPDATE_SNAPSHOTS:-}" ]; then
            echo "UPDATE_SNAPSHOTS is set in CI; the snapshot gate would re-record instead of failing."
            exit 1
          fi
          if ! git ls-files --error-unmatch tests/engine/__snapshots__/assessments.golden.json >/dev/null 2>&1; then
            echo "tests/engine/__snapshots__/assessments.golden.json is not committed."
            exit 1
          fi
          echo "Golden snapshot baseline is committed and the gate is armed."

      - name: Build
        # next build must not run against a .next directory a dev server is using.
        # CI has no dev server, so this is safe here — unlike a local run.
        run: bun run build

      - name: Smoke test the built server (/api/healthz)
        # `bun run start` boots .next/standalone/server.js on PORT 3000. It is
        # backgrounded with its output redirected to a file so the step's own
        # stdout pipe can close; the trap makes sure the server dies even when the
        # curl fails.
        run: |
          set -uo pipefail
          bun run start > /tmp/astrolabe-start.log 2>&1 &
          START_PID=$!
          cleanup() {
            kill "$START_PID" 2>/dev/null || true
            pkill -f "standalone/server.js" 2>/dev/null || true
          }
          trap cleanup EXIT

          echo "Waiting for http://localhost:3000/api/healthz ..."
          if ! curl -fsS --retry 30 --retry-delay 2 --retry-connrefused \
            -o /tmp/healthz.json -w "HTTP %{http_code}\n" http://localhost:3000/api/healthz; then
            echo "--- server log ---"
            cat /tmp/astrolabe-start.log || true
            exit 1
          fi
          echo "--- healthz body ---"
          cat /tmp/healthz.json
          echo
          echo "healthz is live."
